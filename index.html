<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001222">
  <meta name="description" content="Enter Ladder Maze. Read the clues, master your weapons, dodge traps, and outsmart your enemies in a mysterious pixel-art dungeon.">
  <title>Ladder Maze — Logic &amp; Traps</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="header"></header>
  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-art" src="images/main_top_banner.webp" alt="Ladder Maze: a lantern-carrying adventurer exploring a dungeon with ladders, skeletons, and hidden doors" width="2109" height="746" fetchpriority="high">
      <div class="hero-logo" aria-hidden="true"></div>
      <div class="hero-inner">
        <div class="hero-copy">
          <h1 id="hero-title">A maze of hidden dangers<br>and enemies!</h1>
          <p>Read the clues, master your weapons,<br class="desktop-break"> dodge traps, and outsmart your enemies!</p>
          <p class="hero-highlight">Use every clue! Watch every step!</p>
          <div class="store-links" data-stores></div>
        </div>
      </div>
    </section>
    <section class="features-strip" aria-label="How to play">
      <div class="features-inner" id="feature-list"></div>
    </section>
    <section class="screenshots" aria-labelledby="screenshots-title">
      <h2 class="pixel-heading" id="screenshots-title"><span aria-hidden="true" class="sparkle">✣</span> Gameplay Videos <span aria-hidden="true" class="sparkle">✣</span></h2>
      <div class="screenshot-grid" id="screenshot-grid"></div>
    </section>
    <section class="bottom-banner" aria-label="Play Ladder Maze — Logic and Traps">
      <img src="images/main_bottom_banner.webp" alt="Ladder Maze — Logic & Traps. Think, explore, survive!" width="2109" height="746" loading="lazy">
      <button type="button" class="banner-play" data-play aria-label="Play Now — choose your app store"><span class="sr-only">Play Now</span></button>
    </section>
  </main>
  <footer class="site-footer" id="footer"></footer><div id="dialogs"></div>
</body>
</html>
